name: interface-map-dev
services:
  grafana:
    image: grafana/grafana-enterprise:13.2.2
    ports:
      - '127.0.0.1:3001:3000'
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_BASIC_ENABLED: 'true'
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: urrizzz-interfacemap-panel
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: 'false'
      GOMEMLIMIT: '300MiB'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    volumes:
      - ./dist:/var/lib/grafana/plugins/urrizzz-interfacemap-panel:ro
      - ./provisioning:/etc/grafana/provisioning:ro
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:3000/api/health']
      interval: 5s
      timeout: 3s
      retries: 24
